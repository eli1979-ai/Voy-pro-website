name: VOY PRO browser visual QA
on:
  pull_request:
    branches: [main]
    # Run the real-browser gate when customer-facing layouts, interactions or
    # the QA harness change; static content/docs-only PRs skip the extra runner.
    paths:
      - 'site/**/*.html'
      - 'site/assets/*.js'
      - 'site/assets/*.css'
      - 'scripts/qa-visual-browser.mjs'
      - 'scripts/qa-mobile-sitemap.mjs'
      - 'scripts/qa-public-link-assets.mjs'
      - 'scripts/qa-static-asset-budgets.mjs'
      - 'scripts/render-footer-support-email.mjs'
      - 'package.json'
      - 'scripts/qa-lab-performance-browser.mjs'
      - 'site/assets/images/**'
      - 'site/assets/brand/**'
      - 'scripts/qa-affiliate-widget-browser.mjs'
      - 'scripts/qa-booking-funnel-browser.mjs'
      - 'scripts/check-hu-dynamic-translations.mjs'
      - '.github/workflows/visual-browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-visual-qa-system-chrome-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build static website and run standard regression checks
        run: npm run build
      - name: Use hosted-runner Chrome (no browser download or production dependency)
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          google-chrome --version
      - name: Real browser desktop, mobile, RTL and branch navigation checks
        run: node scripts/qa-visual-browser.mjs
      - name: Audit all 50 multilingual sitemap pages at 320px and 390px
        run: node scripts/qa-mobile-sitemap.mjs
      - name: Check every internal link and local image asset
        run: node scripts/qa-public-link-assets.mjs
      - name: Enforce first-party static asset size budgets
        run: node scripts/qa-static-asset-budgets.mjs
      - name: Record offline page load, visible images and layout shift diagnostics
        run: node scripts/qa-lab-performance-browser.mjs
      - name: Test booking dates, composition, empty slots and stale responses with mocked API
        run: node scripts/qa-booking-funnel-browser.mjs
      - name: Verify embedded affiliate widget in actual Chrome with mocked APIs
        run: node scripts/qa-affiliate-widget-browser.mjs
      - name: Upload screenshots and results even after a failed assertion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voy-pro-visual-browser-qa
          path: visual-qa-output/
          if-no-files-found: warn
          retention-days: 7

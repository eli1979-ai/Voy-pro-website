name: Verify prebuilt pilot safety (offline)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/deploy-prebuilt-staging.yml'
      - '.github/workflows/prebuilt-contract.yml'
      - 'scripts/check-prebuilt-workflow.mjs'
      - 'vercel.json'
      - 'site/release.json'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-prebuilt-staging.yml'
      - '.github/workflows/prebuilt-contract.yml'
      - 'scripts/check-prebuilt-workflow.mjs'
      - 'vercel.json'
      - 'site/release.json'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prebuilt-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9ad8a # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate source and manual Preview-only workflow (no Vercel API)
        run: node scripts/check-prebuilt-workflow.mjs

name: Verify VOY PRO staging artifact

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build reviewed staging artifact
        run: npm run build
      - name: Verify release and location selector
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/release.json
          test -f dist/budapest/index.html
          test -f dist/he/budapest/index.html
          test -f dist/hu/budapest/index.html
          test -f dist/portugal/index.html
          test -f dist/he/portugal/index.html
          test -f dist/pt/portugal/index.html
          node - <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const read=p=>fs.readFileSync(path.join('dist',p),'utf8');
          const r=JSON.parse(read('release.json'));
          if(r.version!=='1.32.3') throw new Error('Unexpected release version: '+r.version);
          if(r.target!=='staging'||r.seo_indexable!==false) throw new Error('Staging contract changed');

          const en=read('budapest/index.html');
          const he=read('he/budapest/index.html');
          const hu=read('hu/budapest/index.html');
          const pt=read('portugal/index.html');
          const hePt=read('he/portugal/index.html');
          const ptPt=read('pt/portugal/index.html');

          if(!/<summary[^>]*>Budapest<\/summary>/.test(en)||!/Portugal · Marvão/.test(en)) throw new Error('English Budapest location selector missing');
          if(!/<summary[^>]*>בודפשט<\/summary>/.test(he)||!/פורטוגל · מרבאו/.test(he)) throw new Error('Hebrew Budapest location selector missing');
          if(!/<summary[^>]*>Budapest<\/summary>/.test(hu)||!/Portugália · Marvão/.test(hu)) throw new Error('Hungarian Budapest location selector missing');
          if(!/<summary[^>]*>Portugal · Marvão<\/summary>/.test(pt)||!/>Budapest<\/a>/.test(pt)) throw new Error('English Portugal location selector missing');
          if(!/<summary[^>]*>פורטוגל · מרבאו<\/summary>/.test(hePt)||!/>בודפשט<\/a>/.test(hePt)) throw new Error('Hebrew Portugal location selector missing');
          if(!/<summary[^>]*>Portugal · Marvão<\/summary>/.test(ptPt)||!/>Budapeste<\/a>/.test(ptPt)) throw new Error('Portuguese Portugal location selector missing');

          const css=read('assets/site.css');
          if(!/\.location-switcher/.test(css)||!/\.location-menu/.test(css)) throw new Error('Location selector styling missing');
          if(!/object-fit:contain!important/.test(css)) throw new Error('Full-photo preservation missing');

          const all=[en,he,hu,pt,hePt,ptPt,read('assets/site.js')].join('\n');
          if(/EZRaider OS|\bFBM\b|\bstaging\b|לתפעול|sample times|team check/i.test(all)) throw new Error('Internal copy leaked into public UI');
          console.log('VOY PRO v1.32.3 location-selector contract OK');
          NODE

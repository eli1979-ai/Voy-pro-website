name: Verify VOY PRO staging artifact

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build reviewed staging artifact
        run: npm run build
      - name: Verify release, location selector and brand lockup
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/release.json
          test -f dist/budapest/index.html
          test -f dist/he/budapest/index.html
          test -f dist/hu/budapest/index.html
          test -f dist/portugal/index.html
          test -f dist/he/portugal/index.html
          test -f dist/pt/portugal/index.html
          node - <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const read=p=>fs.readFileSync(path.join('dist',p),'utf8');
          const r=JSON.parse(read('release.json'));
          if(r.version!=='1.32.4') throw new Error('Unexpected release version: '+r.version);
          if(r.target!=='staging'||r.seo_indexable!==false) throw new Error('Staging contract changed');

          const en=read('budapest/index.html');
          const he=read('he/budapest/index.html');
          const hu=read('hu/budapest/index.html');
          const pt=read('portugal/index.html');
          if(!/<summary[^>]*>Budapest<\/summary>/.test(en)||!/Portugal · Marvão/.test(en)) throw new Error('English Budapest selector missing');
          if(!/<summary[^>]*>בודפשט<\/summary>/.test(he)||!/פורטוגל · מרבאו/.test(he)) throw new Error('Hebrew Budapest selector missing');
          if(!/<summary[^>]*>Budapest<\/summary>/.test(hu)||!/Portugália · Marvão/.test(hu)) throw new Error('Hungarian Budapest selector missing');
          if(!/<summary[^>]*>Portugal · Marvão<\/summary>/.test(pt)||!/>Budapest<\/a>/.test(pt)) throw new Error('Portugal selector missing');

          const css=read('assets/site.css');
          if(!/\.nav>\.brand\{font-size:22px/.test(css)) throw new Error('Desktop brand lockup sizing missing');
          if(!/\.location-switcher:before/.test(css)) throw new Error('Brand/location divider missing');
          if(!/font-size:17px/.test(css)) throw new Error('Location typography missing');
          if(!/border:0!important/.test(css)||!/background:transparent!important/.test(css)) throw new Error('Old pill styling not removed');
          if(!/object-fit:contain!important/.test(css)) throw new Error('Full-photo preservation missing');

          const all=[en,he,hu,pt,read('assets/site.js')].join('\n');
          if(/EZRaider OS|\bFBM\b|\bstaging\b|לתפעול|sample times|team check/i.test(all)) throw new Error('Internal copy leaked into public UI');
          console.log('VOY PRO v1.32.4 brand-lockup contract OK');
          NODE

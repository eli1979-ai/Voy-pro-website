name: Verify VOY PRO staging artifact

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build reviewed staging artifact
        run: npm run build
      - name: Verify release contract and critical routes
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/release.json
          test -f dist/robots.txt
          test -f dist/budapest/index.html
          test -f dist/he/budapest/index.html
          test -f dist/portugal/index.html
          test -f dist/he/portugal/index.html
          test -f dist/pt/portugal/index.html
          test -f dist/manage/index.html
          grep -q "Disallow: /" dist/robots.txt
          node - <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('dist/release.json','utf8'));
          if (r.version !== '1.28.0') throw new Error('Unexpected release version: '+r.version);
          if (r.target !== 'staging') throw new Error('Expected staging target');
          if (r.booking_enabled !== true) throw new Error('Staging booking must be enabled');
          if (r.seo_indexable !== false) throw new Error('Staging must be non-indexable');
          if (r.sitemap_urls !== 27) throw new Error('Expected 27 sitemap URLs');
          console.log('Release contract OK', r);
          NODE

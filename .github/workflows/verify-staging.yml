name: Verify VOY PRO staging artifact

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build reviewed staging artifact
        run: npm run build
      - name: Verify launch readiness contract
        run: npm run verify:launch
      - name: Site-wide static QA
        run: npm run qa:site
      - name: Verify booking confirmation and pay-now UI
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const read=p=>fs.readFileSync(path.join('dist',p),'utf8');
          const r=JSON.parse(read('release.json'));
          if(r.version!=='1.47.12') throw new Error('Unexpected release version: '+r.version);
          if(r.target!=='staging'||r.seo_indexable!==false) throw new Error('Staging contract changed');

          const en=read('budapest/index.html');
          const he=read('he/budapest/index.html');
          const hu=read('hu/budapest/index.html');
          for(const [name,html] of Object.entries({en,he,hu})){
            if(!/content="summary_large_image" name="twitter:card"/.test(html)) throw new Error(name+' Budapest large social card missing');
            if(!/property="og:image"/.test(html)||!/name="twitter:image"/.test(html)) throw new Error(name+' Budapest social hero image missing');
            if(!/https:\/\/voy-pro\.com\/assets\/images\/budapest\/img12\.jpg\?v=1\.47\.11/.test(html)) throw new Error(name+' Budapest social hero URL invalid');
          }
          for(const [name,html] of Object.entries({en,he,hu})){
            if(!/value="exp_bud_buda"/.test(html)||!/value="exp_bud_margaret"/.test(html)) throw new Error(name+' tour selector regressed');
            if(/data-wa="" href="#"/.test(html)||/href="#"[^>]*data-wa=""/.test(html)) throw new Error(name+' WhatsApp still has hash fallback');
            if(!/wa\.me\/36300993099/.test(html)) throw new Error(name+' static WhatsApp fallback missing');
          }

          const manage=read('manage/index.html');
          for(const m of manage.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)){
            const code=(m[1]||'').trim();
            if(code) new Function(code);
          }
          if(!/hashParams\.get\('token'\)/.test(manage)||!/safeHash\.set\('token',token\)/.test(manage)) throw new Error('Manage token refresh-safe fragment handling missing');
          if(!/supportWhatsApp\(\)/.test(manage)||!/Booking reference:/.test(manage)) throw new Error('Manage WhatsApp booking context missing');
          if(!/\/manage\/['"]?\+encodeURIComponent\(token\)\+['"]?\/cancel/.test(manage)&&!/encodeURIComponent\(token\).*\/cancel/.test(manage)) throw new Error('Manage cancellation endpoint wiring missing');
          if(!/src="\/assets\/site\.js"/.test(manage)) throw new Error('Manage cookie/preferences runtime missing');
          if(!/הונגריה, בודפשט/.test(manage)||!/Magyarország, Budapest/.test(manage)) throw new Error('Manage localized footer regression');
          if(!/#token=/.test(read('assets/site.js'))) throw new Error('Booking confirmation must use fragment-based Manage link');
          const js=read('assets/site.js');
          if(/setBookingStep\(3\);setBookingStep\(2\)/.test(js)) throw new Error('Checkout stepper still regresses to step 2');
          if(!/shell\.hidden=false;setBookingStep\(3\)/.test(js)) throw new Error('Checkout does not enter step 3 after hold creation');
          if(!/checkoutForm\.dataset\.submitting==='true'/.test(js)||!/aria-busy/.test(js)) throw new Error('Checkout duplicate-submit guard missing');
          if(!/bookingState\.idempotencyKey\|\|\(bookingState\.idempotencyKey='voy_'\+uuid\(\)\)/.test(js)) throw new Error('Stable checkout idempotency key missing');
          if(!/initPaymentReturnNotice/.test(js)||!/payment_cancelled_return/.test(js)) throw new Error('Stripe cancellation return UX missing');

          const hePortugal=read('he/portugal/index.html');
          const ptPortugal=read('pt/portugal/index.html');
          for(const [name,html] of Object.entries({hePortugal,ptPortugal})){
            if(/directly with Pombais|ישירות מול Pombais|diretamente com a Pombais|diretamente para a Pombais|page EZRaider da Pombais/i.test(html)) throw new Error(name+' still bypasses VOY PRO request flow');
            if((html.match(/data-portugal-tour="express"/g)||[]).length!==1) throw new Error(name+' duplicate Express route attribute');
            if((html.match(/data-portugal-tour="explorer"/g)||[]).length!==1) throw new Error(name+' duplicate Explorer route attribute');
          }

          if(!/a\.addEventListener\('pointerdown',refresh\)/.test(js)) throw new Error('WhatsApp pointerdown hardening missing');
          if(!/Source:/.test(js)||!/Campaign:/.test(js)||!/Referral:/.test(js)) throw new Error('WhatsApp referral attribution missing');
          if(!/booking_confirmation/.test(js)||!/Booking reference:/.test(js)) throw new Error('Confirmed-booking WhatsApp context missing');
          if(!/payment_method/.test(js)||!/Total:/.test(js)) throw new Error('Booking payment details missing from WhatsApp');
          if(!/\/payments\/capabilities/.test(js)||!/pay_now_card/.test(js)) throw new Error('Pay-now capability UI missing');
          if(!/\/payments\/intents/.test(js)||!/checkout_url/.test(js)) throw new Error('Stripe redirect flow missing');
          if(/e\.preventDefault\(\);releaseHold\(\);setBookingStep\(1\)/.test(js)) throw new Error('Availability still resets to step 1');
          if(!/REQUEST_TIMEOUT/.test(js)) throw new Error('API timeout regression');
          if(/EZRaider OS|\bFBM\b|\bstaging\b|לתפעול|sample times|team check/i.test([en,he,hu,js].join('\n'))) throw new Error('Internal copy leaked into public UI');
          if(!/From €70/.test(en)||!/€120/.test(en)) throw new Error('English fallback pricing missing');
          if(!/החל מ־€70/.test(he)||!/€120/.test(he)) throw new Error('Hebrew fallback pricing missing');
          if(!/€70-tól/.test(hu)||!/€120/.test(hu)) throw new Error('Hungarian fallback pricing missing');
          if(!/data-mobile-language-row/.test(js)||!/consent-open/.test(js)) throw new Error('Mobile navigation/consent hardening missing');
          if(!/optimizeHomeConversion/.test(js)||!/enhanceBookingFormLayout/.test(js)||!/smartDefault/.test(js)) throw new Error('Conversion funnel runtime missing');
          for(const [name,html] of Object.entries({en,he,hu})){
            const picker=html.indexOf('class="section tour-picker"'), booking=html.indexOf('class="section booking"'), gallery=html.indexOf('photo-gallery-section');
            if(!(picker>=0&&booking>picker&&gallery>booking)) throw new Error(name+' homepage conversion order regressed');
          }
          for(const [name,html] of Object.entries({en,he,hu})){
            const picker=(html.match(/<section class="section tour-picker"[\s\S]*?<\/section>/)||[])[0]||'';
            if((picker.match(/data-tour-detail=""/g)||[]).length<8) throw new Error(name+' tour detail links missing');
            if((picker.match(/class="tour-choice-actions"/g)||[]).length!==4) throw new Error(name+' separate tour actions missing');
            if((picker.match(/data-select-experience=""/g)||[]).length<2) throw new Error(name+' availability selectors missing');
          }
          for(const p of [
            'budapest/tours/buda-margaret-extended-tour/index.html',
            'he/budapest/tours/buda-margaret-extended-tour/index.html',
            'hu/budapest/tours/buda-margaret-extended-tour/index.html'
          ]){
            if(!read(p).includes('class="special-request-panel" id="request"')) throw new Error('Extended request anchor missing: '+p);
          }
          const tourCardPages=[
            ['budapest/index.html',4],['he/budapest/index.html',4],['hu/budapest/index.html',4],
            ['portugal/index.html',3],['he/portugal/index.html',3],['pt/portugal/index.html',3]
          ];
          for(const [p,expected] of tourCardPages){
            const html=read(p);
            const mapped=[...html.matchAll(/data-tour-image="([^"]+)" style="--tour-card-image:url\('([^']+)'\)"/g)];
            if(mapped.length!==expected) throw new Error('Tour card image mapping count invalid: '+p);
            for(const [,id,img] of mapped){
              if(!img.startsWith('/assets/images/')) throw new Error('Tour card image must be local: '+p+' '+id);
            }
          }
          const routeOrderChecks=[
            ['budapest/tours/buda-castle-ezraider-tour/index.html','Buda Castle &amp; Royal Palace','Clark Ádám Square','Matthias Church'],
            ['he/budapest/tours/buda-castle-ezraider-tour/index.html','טירת בודה והארמון המלכותי','כיכר אדם קלארק','כנסיית מתיאש'],
            ['hu/budapest/tours/buda-castle-ezraider-tour/index.html','Budai Vár és Királyi Palota','Clark Ádám tér','Mátyás-templom'],
            ['budapest/tours/buda-margaret-extended-tour/index.html','Buda Castle &amp; Royal Palace','Clark Ádám Square','Matthias Church &amp; Fisherman’s Bastion'],
            ['he/budapest/tours/buda-margaret-extended-tour/index.html','טירת בודה והארמון המלכותי','כיכר אדם קלארק','כנסיית מתיאש ומצודת הדייגים'],
            ['hu/budapest/tours/buda-margaret-extended-tour/index.html','Budai Vár és Királyi Palota','Clark Ádám tér','Mátyás-templom és Halászbástya']
          ];
          for(const [p,palace,clark,matthias] of routeOrderChecks){
            const html=read(p);
            const route=(html.match(/<section class="section route-itinerary"[\s\S]*?<\/section>/)||[])[0]||'';
            const a=route.indexOf(palace), b=route.indexOf(clark), d=route.indexOf(matthias);
            if(!(a>=0&&b>a&&d>b)) throw new Error('Buda route order regression: '+p);
          }
          const budapestRoutePages=[
            ['budapest/tours/buda-castle-ezraider-tour/index.html',7,true],
            ['budapest/tours/margaret-island-ezraider-tour/index.html',6,false],
            ['budapest/tours/buda-margaret-extended-tour/index.html',9,true],
            ['he/budapest/tours/buda-castle-ezraider-tour/index.html',7,true],
            ['he/budapest/tours/margaret-island-ezraider-tour/index.html',6,false],
            ['he/budapest/tours/buda-margaret-extended-tour/index.html',9,true],
            ['hu/budapest/tours/buda-castle-ezraider-tour/index.html',7,true],
            ['hu/budapest/tours/margaret-island-ezraider-tour/index.html',6,false],
            ['hu/budapest/tours/buda-margaret-extended-tour/index.html',9,true]
          ];
          for(const [p,expectedStops,needsClark] of budapestRoutePages){
            const html=read(p);
            if((html.match(/class="section route-itinerary"/g)||[]).length!==1) throw new Error('Budapest route section missing: '+p);
            if((html.match(/class="route-stop"/g)||[]).length!==expectedStops) throw new Error('Budapest route stop count invalid: '+p);
            if(needsClark&&!/(Clark Ádám|אדם קלארק)/.test(html)) throw new Error('Clark Adam / Kilometre Zero route stop missing: '+p);
          }
          for(const p of ['portugal/index.html','he/portugal/index.html','pt/portugal/index.html']){
            const html=read(p);
            if((html.match(/class="section marvao-route-details"/g)||[]).length!==1) throw new Error('Marvao route details section missing: '+p);
            if((html.match(/class="marvao-route-card"/g)||[]).length!==3) throw new Error('Marvao route card count invalid: '+p);
            if((html.match(/class="route-stop"/g)||[]).length!==14) throw new Error('Marvao route stop count invalid: '+p);
            if((html.match(/class="tour-route-link"/g)||[]).length!==3) throw new Error('Marvao route detail links missing: '+p);
            if(!html.includes('id="route-express"')||!html.includes('id="route-explorer"')||!html.includes('id="route-megalithic"')) throw new Error('Marvao route anchors missing: '+p);
            if(!/Sever/.test(html)||!/Beirã/.test(html)) throw new Error('Marvao published Megalithic highlights missing: '+p);
          }
          const css=read('assets/site.css');
          if(!/\.route-itinerary-grid/.test(css)||!/\.marvao-route-grid/.test(css)||!/\.tour-route-link/.test(css)) throw new Error('Detailed route CSS missing');
          if(!/\.tour-choice-card\[data-tour-image\],\.portugal-tour-card\[data-tour-image\]/.test(css)||!/var\(--tour-card-image\)/.test(css)) throw new Error('Tour card photography CSS missing');
          const budapestRoots=['budapest','he/budapest','hu/budapest'];
          const walkHtml=dir=>fs.readdirSync(path.join('dist',dir),{withFileTypes:true}).flatMap(entry=>{
            const rel=path.join(dir,entry.name);
            return entry.isDirectory()?walkHtml(rel):(entry.isFile()&&entry.name.endsWith('.html')?[rel]:[]);
          });
          const budapestPages=budapestRoots.flatMap(walkHtml);
          if(budapestPages.length<36) throw new Error('Budapest page coverage unexpectedly low: '+budapestPages.length);
          let localBudapestImageRefs=0;
          for(const p of budapestPages){
            const html=read(p);
            if(/ezraidereu\.com/i.test(html)) throw new Error('Budapest still depends on EZRaiderEU media: '+p);
            localBudapestImageRefs+=(html.match(/\/assets\/images\/budapest\/img\d+\.(?:jpg|jpeg|webp|png)/gi)||[]).length;
          }
          if(localBudapestImageRefs<30) throw new Error('Budapest local image references unexpectedly low: '+localBudapestImageRefs);
          for(const file of ['img02.jpg','img08.jpg','img12.jpg','img13.jpg','img14.jpg','img15.jpg','img16.jpg','img17.jpg']){
            if(!fs.existsSync(path.join('dist','assets','images','budapest',file))) throw new Error('Budapest local image asset missing: '+file);
          }
          const legalPages=[
            'legal/terms/index.html','legal/privacy/index.html','legal/cookies/index.html','legal/legal-notice/index.html','legal/accessibility/index.html',
            'he/legal/terms/index.html','he/legal/privacy/index.html','he/legal/cookies/index.html','he/legal/legal-notice/index.html','he/legal/accessibility/index.html',
            'hu/legal/terms/index.html','hu/legal/privacy/index.html','hu/legal/cookies/index.html','hu/legal/legal-notice/index.html','hu/legal/accessibility/index.html',
            'pt/legal/terms/index.html','pt/legal/privacy/index.html','pt/legal/cookies/index.html','pt/legal/legal-notice/index.html','pt/legal/accessibility/index.html'
          ];
          for(const p of legalPages){if(!fs.existsSync(path.join('dist',p))) throw new Error('Legal center missing: '+p);}
          for(const [name,html] of Object.entries({en,he,hu})){
            if(!/Prague|פראג|Prága/.test(html)||!/data-cookie-settings/.test(html)||!/legal\/privacy\//.test(html)) throw new Error(name+' footer legal/branches missing');
          }
          if(!/showConsentPreferences\(force=false\)/.test(js)||!/data-cookie-settings/.test(js)) throw new Error('Cookie preference reopening missing');
          if(!/name="legal_acceptance" required/.test(js)||!/Book now – payment obligation/.test(js)) throw new Error('Binding checkout legal acceptance/payment wording missing');
          if(!/data-checkout-legal/.test(js)||!/legal\.hidden=true/.test(js)) throw new Error('Non-binding request legal-state separation missing');
          if(!/const isLegalPage=routePath\.includes\('\/legal\/'\)/.test(js)||!/!isLegalPage&&cfg\.bookingEnabled/.test(js)) throw new Error('Legal pages must not create booking analytics sessions');
          if(/header \.language-picker\{display:none!important\}/.test(css)) throw new Error('Header language picker hidden on mobile');
          if(!/header \.language-picker\{display:inline-flex!important/.test(css)||!/consent-open \.mobilebook/.test(css)) throw new Error('Mobile header language/consent CSS missing');
          if(!/\.party-fields/.test(css)||!/#availability-form>button\[type="submit"\]/.test(css)) throw new Error('Compact booking CSS missing');
          const discoveryPages=[
            ['en',en,'/budapest/tours/buda-castle-ezraider-tour/','/budapest/tours/margaret-island-ezraider-tour/','/budapest/tours/buda-margaret-extended-tour/','/budapest/private-tours/'],
            ['he',he,'/he/budapest/tours/buda-castle-ezraider-tour/','/he/budapest/tours/margaret-island-ezraider-tour/','/he/budapest/tours/buda-margaret-extended-tour/','/he/budapest/private-tours/'],
            ['hu',hu,'/hu/budapest/tours/buda-castle-ezraider-tour/','/hu/budapest/tours/margaret-island-ezraider-tour/','/hu/budapest/tours/buda-margaret-extended-tour/','/hu/budapest/private-tours/']
          ];
          for(const [name,html,...targets] of discoveryPages){
            if((html.match(/class="tour-detail-link"/g)||[]).length!==4) throw new Error(name+' tour detail card links missing');
            for(const target of targets) if(!html.includes('data-tour-detail="" href="'+target+'"')) throw new Error(name+' direct tour link missing: '+target);
            if((html.match(/data-select-experience=""/g)||[]).length<2) throw new Error(name+' availability selectors missing');
          }
          if(!/\.tour-detail-link:after/.test(css)||!/\.tour-choice-bottom \.btn\{position:relative;z-index:3\}/.test(css)) throw new Error('Clickable tour-card CSS missing');
          const routePages=[
            'budapest/tours/buda-castle-ezraider-tour/index.html','budapest/tours/margaret-island-ezraider-tour/index.html','budapest/private-tours/index.html',
            'he/budapest/tours/buda-castle-ezraider-tour/index.html','he/budapest/tours/margaret-island-ezraider-tour/index.html','he/budapest/private-tours/index.html',
            'hu/budapest/tours/buda-castle-ezraider-tour/index.html','hu/budapest/tours/margaret-island-ezraider-tour/index.html','hu/budapest/private-tours/index.html'
          ];
          for(const p of routePages){
            const html=read(p);
            if(!html.includes('id="booking"')) throw new Error('Booking section missing: '+p);
            if(/href="\/(?:he\/|hu\/)?budapest\/\?[^"]*#booking"/.test(html)) throw new Error('Tour-page CTA leaves selected tour: '+p);
          }
          const seoTours=[
            ['budapest/tours/buda-castle-ezraider-tour/index.html',70],
            ['budapest/tours/margaret-island-ezraider-tour/index.html',70],
            ['budapest/tours/buda-margaret-extended-tour/index.html',120],
            ['he/budapest/tours/buda-castle-ezraider-tour/index.html',70],
            ['he/budapest/tours/margaret-island-ezraider-tour/index.html',70],
            ['he/budapest/tours/buda-margaret-extended-tour/index.html',120],
            ['hu/budapest/tours/buda-castle-ezraider-tour/index.html',70],
            ['hu/budapest/tours/margaret-island-ezraider-tour/index.html',70],
            ['hu/budapest/tours/buda-margaret-extended-tour/index.html',120]
          ];
          for(const [p,price] of seoTours){
            const html=read(p);
            if(!/twitter:card" content="summary_large_image"|content="summary_large_image" name="twitter:card"/.test(html)) throw new Error('Large social card missing: '+p);
            if(!/property="og:image"/.test(html)||!/name="twitter:image"/.test(html)) throw new Error('Social image missing: '+p);
            const scripts=[...html.matchAll(/<script type="application\/ld\+json">([^<]+)<\/script>/g)].map(m=>JSON.parse(m[1]));
            const trip=scripts.find(v=>v['@type']==='TouristTrip');
            const crumbs=scripts.find(v=>v['@type']==='BreadcrumbList');
            if(!trip) throw new Error('TouristTrip schema missing: '+p);
            if(!crumbs||crumbs.itemListElement?.map(v=>v.position).join(',')!=='1,2,3') throw new Error('Breadcrumb hierarchy invalid: '+p);
            if(String(trip.offers?.price)!==String(price)||trip.offers?.priceCurrency!=='EUR') throw new Error('Tour price schema invalid: '+p);
            if(trip.provider?.name!=='AllGo Guided Tours Bud Kft.') throw new Error('Tour provider schema invalid: '+p);
            if(trip.itinerary?.['@type']!=='ItemList'||!trip.itinerary.itemListElement?.length) throw new Error('Tour itinerary schema missing: '+p);
            const route=(html.match(/<section class="section route-itinerary"[\s\S]*?<\/section>/)||[])[0]||'';
            const visibleStops=[...route.matchAll(/<h3>(.*?)<\/h3>/g)].map(m=>m[1].replace(/&amp;/g,'&'));
            const schemaStops=(trip.itinerary.itemListElement||[]).map(v=>v.item?.name);
            if(JSON.stringify(visibleStops)!==JSON.stringify(schemaStops)) throw new Error('Tour itinerary schema does not match visible route: '+p);
            if(scripts.some(v=>v['@type']==='FAQPage')) throw new Error('Deprecated FAQPage schema emitted: '+p);
          }
          const intentPages=[
            'budapest/with-kids/index.html','budapest/first-day/index.html','budapest/unique-things-to-do/index.html','budapest/buda-castle-without-walking/index.html',
            'he/budapest/with-kids/index.html','he/budapest/first-day/index.html','he/budapest/unique-things-to-do/index.html','he/budapest/buda-castle-without-walking/index.html',
            'hu/budapest/with-kids/index.html','hu/budapest/first-day/index.html','hu/budapest/unique-things-to-do/index.html','hu/budapest/buda-castle-without-walking/index.html'
          ];
          for(const p of intentPages){
            const html=read(p);
            if(!html.includes('data-intent-bridge=""')) throw new Error('Intent bridge missing: '+p);
            if(!html.includes('href="#booking"')) throw new Error('Local booking CTA missing: '+p);
            if(/href="\/(?:he\/|hu\/)?budapest\/#booking"/.test(html)) throw new Error('Intent CTA still leaves page: '+p);
            const bridge=(html.match(/<section class="section intent-bridge"[\s\S]*?<\/section>/)||[])[0]||'';
            if((bridge.match(/class="intent-bridge-card"/g)||[]).length!==3) throw new Error('Intent route cards missing: '+p);
            if((bridge.match(/href="\/(?:he\/|hu\/)?budapest\/(?:tours\/|private-tours\/)/g)||[]).length<3) throw new Error('Intent route links not crawlable: '+p);
            const scripts=[...html.matchAll(/<script type="application\/ld\+json">([^<]+)<\/script>/g)].map(m=>JSON.parse(m[1]));
            const crumbs=scripts.find(v=>v['@type']==='BreadcrumbList');
            if(!crumbs||crumbs.itemListElement?.map(v=>v.position).join(',')!=='1,2,3') throw new Error('Intent breadcrumb hierarchy invalid: '+p);
          }
          for(const [name,html] of Object.entries({en,he,hu})){
            if(!html.includes('data-intent-hub=""')) throw new Error(name+' intent hub missing');
            const hub=(html.match(/<section class="section intent-hub"[\s\S]*?<\/section>/)||[])[0]||'';
            if((hub.match(/class="intent-hub-card"/g)||[]).length!==4) throw new Error(name+' intent hub card count invalid');
            for(const slug of ['with-kids','first-day','unique-things-to-do','buda-castle-without-walking']) if(!hub.includes('/'+slug+'/')) throw new Error(name+' intent hub link missing: '+slug);
          }
          if(!/\.intent-bridge-grid/.test(css)||!/\.intent-hub-grid/.test(css)) throw new Error('Intent cluster CSS missing');
          const sitemap=read('sitemap.xml');
          const refreshedSitemapUrls=[
            'https://voy-pro.com/budapest/tours/buda-castle-ezraider-tour/',
            'https://voy-pro.com/budapest/tours/buda-margaret-extended-tour/',
            'https://voy-pro.com/budapest/tours/margaret-island-ezraider-tour/',
            'https://voy-pro.com/he/budapest/tours/buda-castle-ezraider-tour/',
            'https://voy-pro.com/he/budapest/tours/buda-margaret-extended-tour/',
            'https://voy-pro.com/he/budapest/tours/margaret-island-ezraider-tour/',
            'https://voy-pro.com/hu/budapest/tours/buda-castle-ezraider-tour/',
            'https://voy-pro.com/hu/budapest/tours/buda-margaret-extended-tour/',
            'https://voy-pro.com/hu/budapest/tours/margaret-island-ezraider-tour/',
            'https://voy-pro.com/portugal/','https://voy-pro.com/he/portugal/','https://voy-pro.com/pt/portugal/'
          ];
          for(const url of refreshedSitemapUrls){
            const entry='<url><loc>'+url+'</loc><lastmod>2026-09-21</lastmod></url>';
            if(!sitemap.includes(entry)) throw new Error('Fresh sitemap lastmod missing: '+url);
          }
          for(const p of ['portugal/index.html','he/portugal/index.html','pt/portugal/index.html']){
            const html=read(p);
            if(!html.includes('class="hero-card portugal-hero-card"')||!html.includes('class="portugal-hero-photo"')) throw new Error('Portugal photographic hero missing: '+p);
            if(!html.includes('/assets/images/portugal/marvao-01.jpg')) throw new Error('Portugal hero local image missing: '+p);
            if(html.includes('class="portugal-visual"')) throw new Error('Portugal legacy illustrated hero returned: '+p);
          }
          if(!/\.portugal-hero-photo\{/.test(css)||!/\.portugal-gallery-grid\{grid-template-columns:1fr;gap:12px\}/.test(css)||!/\.portugal-gallery-grid figure\{border-radius:16px;aspect-ratio:16\/10\}/.test(css)) throw new Error('Portugal mobile visual framing regression');
          if(!/\.portugal-hero-photo img\{[^}]*object-position:center 78%/.test(css)||!/\.portugal-gallery-grid img\{[^}]*object-position:center 72%/.test(css)||!/\.portugal-hero-photo img\{object-position:center 82%\}/.test(css)||!/\.portugal-gallery-grid img\{height:100%;aspect-ratio:auto;object-fit:cover;object-position:center 80%\}/.test(css)) throw new Error('Portugal image focal-point regression');
          const portugalPages=[
            ['portugal/index.html','https://voy-pro.com/portugal/#request'],
            ['he/portugal/index.html','https://voy-pro.com/he/portugal/#request'],
            ['pt/portugal/index.html','https://voy-pro.com/pt/portugal/#request']
          ];
          for(const [p,requestUrl] of portugalPages){
            const html=read(p);
            if(!/content="summary_large_image" name="twitter:card"/.test(html)) throw new Error('Portugal large social card missing: '+p);
            if(!/property="og:image"/.test(html)||!/name="twitter:image"/.test(html)) throw new Error('Portugal social hero image missing: '+p);
            if(!/https:\/\/voy-pro\.com\/assets\/images\/portugal\/marvao-01\.jpg\?v=1\.47\.12/.test(html)) throw new Error('Portugal social hero URL invalid: '+p);
            if(/https:\/\/www\.pombais\.pt/i.test(html)) throw new Error('Portugal still hands booking to Pombais: '+p);
            if(!html.includes('data-portugal-request-form')||!html.includes('id="request"')) throw new Error('Portugal VOY PRO request form missing: '+p);
            if(!html.includes('/assets/site.js')) throw new Error('Portugal shared runtime missing: '+p);
            if(!html.includes('class="section portugal-gallery"')) throw new Error('Portugal photo gallery missing: '+p);
            const gallery=(html.match(/<div class="portugal-gallery-grid">([\s\S]*?)<\/div><p class="portugal-gallery-credit">/)||[])[1]||'';
            const localImages=[...gallery.matchAll(/src="(\/assets\/images\/portugal\/marvao-0[1-4]\.(?:jpg|webp))"/g)].map(m=>m[1]);
            if(localImages.length!==4||new Set(localImages).size!==4) throw new Error('Portugal local gallery asset set invalid: '+p);
            if(/https?:\/\/(?:www\.)?pombais\.pt\/[^"'\s>]+\.(?:jpg|jpeg|webp|png)/i.test(html)) throw new Error('Portugal gallery hotlinks Pombais media: '+p);
            if((html.match(/loading="lazy"/g)||[]).length<4) throw new Error('Portugal gallery lazy loading missing: '+p);
            const scripts=[...html.matchAll(/<script type="application\/ld\+json">([^<]+)<\/script>/g)].map(m=>JSON.parse(m[1]));
            const list=scripts.find(v=>v['@type']==='ItemList');
            if(!list||list.itemListElement?.length!==3) throw new Error('Portugal tour schema missing: '+p);
            const routeIds=['route-express','route-explorer','route-megalithic'];
            for(let i=0;i<list.itemListElement.length;i++){
              const item=list.itemListElement[i];
              if(item.item?.offers?.url!==requestUrl) throw new Error('Portugal schema offer leaves VOY PRO: '+p);
              if(item.item?.provider?.name!=='Pombais Experience & Villas') throw new Error('Portugal local operator transparency regressed: '+p);
              const id=routeIds[i];
              const start=html.indexOf('id="'+id+'"');
              const end=start>=0?html.indexOf('</article>',start):-1;
              const block=start>=0&&end>start?html.slice(start,end):'';
              const visibleStops=[...block.matchAll(/<h4>(.*?)<\/h4>/g)].map(m=>m[1].replace(/&amp;/g,'&'));
              const schemaStops=(item.item?.itinerary?.itemListElement||[]).map(v=>v.item?.name);
              if(!visibleStops.length||JSON.stringify(visibleStops)!==JSON.stringify(schemaStops)) throw new Error('Portugal itinerary schema does not match visible route: '+p+' '+id);
            }
          }
          if(!/const isPortugalPage=routePath\.includes\('\/portugal\/'\)/.test(js)) throw new Error('Portugal route guard missing');
          if(!/bindPortugalRequestFlow/.test(js)||/a\[href\*="pombais\.pt"\]/.test(js)) throw new Error('Portugal request runtime invalid');
          if(!/const destinationId=isPortugalPage\?'portugal-marvao':'budapest'/.test(js)) throw new Error('Destination-aware runtime missing');
          if(!/destinationClients\[destinationId\]/.test(js)||!/destinationId==='budapest'&&cfg\.clientKey/.test(js)) throw new Error('Destination client isolation missing');
          if(!/if\(!analyticsAllowed\(\)\|\|!bookingEnabled\) return/.test(js)||!/if\(!bookingEnabled\) return null/.test(js)) throw new Error('Unconfigured destination must not write sessions or analytics');
          if(!/destination_id:destinationId/.test(js)) throw new Error('Destination id is still hardcoded in runtime');
          if(!/\.portugal-request-grid/.test(css)) throw new Error('Portugal request CSS missing');
          if(!/\.portugal-gallery-grid/.test(css)) throw new Error('Portugal gallery CSS missing');
          console.log('VOY PRO v1.45.0 footer + legal center + compliant checkout baseline OK');
          NODE

      - name: Smoke public booking API from website origin
        shell: bash
        run: |
          set -euo pipefail
          eval "$(node - <<'NODE'
          const fs=require('fs');
          const txt=fs.readFileSync('dist/assets/runtime-config.js','utf8');
          const api=(txt.match(/apiRoot:'([^']+)'/)||[])[1];
          const key=(txt.match(/clientKey:'([^']+)'/)||[])[1];
          if(!api||!key) throw new Error('runtime booking config missing');
          console.log('API_ROOT='+JSON.stringify(api));
          console.log('CLIENT_KEY='+JSON.stringify(key));
          NODE
          )"
          ORIGINS=('https://voy-pro-staging.vercel.app' 'https://voy-pro.com')
          for ORIGIN in "${ORIGINS[@]}"; do
            suffix="$(printf '%s' "$ORIGIN" | tr -cd 'a-zA-Z0-9')"
            code="$(curl -sS -o "/tmp/preflight-$suffix.out" -D "/tmp/preflight-$suffix.headers" -w '%{http_code}' -X OPTIONS "$API_ROOT/experiences" \
              -H "Origin: $ORIGIN" \
              -H 'Access-Control-Request-Method: GET' \
              -H 'Access-Control-Request-Headers: x-voy-client-key')"
            test "$code" = "204"
            grep -qi "^access-control-allow-origin: $ORIGIN" "/tmp/preflight-$suffix.headers"

            code="$(curl -sS -o "/tmp/experiences-$suffix.json" -w '%{http_code}' "$API_ROOT/experiences" \
              -H "Origin: $ORIGIN" \
              -H "x-voy-client-key: $CLIENT_KEY")"
            test "$code" = "200"
            node -e "const x=require('/tmp/experiences-$suffix.json'); if(!Array.isArray(x)||!x.some(v=>v.id==='exp_bud_buda')) process.exit(1)"
          done

          ORIGIN='https://voy-pro.com'
          DATE="$(TZ=Europe/Budapest date -d '+1 day' +%F)"
          code="$(curl -sS -o /tmp/availability.json -w '%{http_code}' \
            "$API_ROOT/experiences/exp_bud_buda/availability?date=$DATE&riders_16_plus=1&child_passengers_3_15=0&baby_passengers_1_2=0&is_private=false&guide_language=en" \
            -H "Origin: $ORIGIN" \
            -H "x-voy-client-key: $CLIENT_KEY")"
          test "$code" = "200"
          node -e "const x=require('/tmp/availability.json'); if(!Array.isArray(x.slots)) process.exit(1); console.log('custom-domain availability slots:',x.slots.length)"

          code="$(curl -sS -o /tmp/payment-capabilities.json -w '%{http_code}' "$API_ROOT/payments/capabilities" \
            -H "Origin: $ORIGIN" \
            -H "x-voy-client-key: $CLIENT_KEY")"
          test "$code" = "200"
          node -e "const x=require('/tmp/payment-capabilities.json'); if(typeof x.online_card!=='boolean') process.exit(1); console.log('custom-domain online card enabled:',x.online_card)"

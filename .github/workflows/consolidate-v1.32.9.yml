name: Consolidate v1.32.9 baseline

on:
  push:
    branches: [consolidate-v1.32.9]

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consolidate-v1.32.9
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build exact v1.32.9 output
        run: npm run build

      - name: Verify existing release before consolidation
        shell: bash
        run: |
          set -euo pipefail
          node --check dist/assets/site.js
          node - <<'NODE'
          const fs=require('fs');
          const read=p=>fs.readFileSync('dist/'+p,'utf8');
          const r=JSON.parse(read('release.json'));
          if(r.version!=='1.32.9') throw new Error('Expected v1.32.9, got '+r.version);
          const js=read('assets/site.js');
          const required=[
            '/payments/capabilities',
            '/payments/intents',
            'pay_now_card',
            'booking_confirmation',
            'Booking reference:',
            'REQUEST_TIMEOUT',
            'exp_bud_buda',
            'exp_bud_margaret',
            "setBookingStep(2)"
          ];
          for(const marker of required) if(!js.includes(marker)) throw new Error('Missing marker: '+marker);
          for(const p of ['budapest/index.html','he/budapest/index.html','hu/budapest/index.html']){
            const html=read(p);
            if(!html.includes('value="exp_bud_buda"')||!html.includes('value="exp_bud_margaret"')) throw new Error('Tour selector regression: '+p);
            if(!html.includes('wa.me/36300993099')) throw new Error('WhatsApp fallback missing: '+p);
          }
          console.log('v1.32.9 verified before consolidation');
          NODE

      - name: Materialize clean source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          cp -a dist/. site/

          node - <<'NODE'
          const fs=require('fs');
          const p='site/release.json';
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          r.version='1.33.0';
          r.based_on='1.32.9';
          r.build_model='consolidated-source';
          fs.writeFileSync(p,JSON.stringify(r,null,2)+'\n');
          NODE

          mkdir -p legacy/v1.32.9-build-chain
          for item in .deploy-v131 .deploy-parts overrides artifact; do
            if [ -e "$item" ]; then git mv "$item" legacy/v1.32.9-build-chain/; fi
          done

          cat > package.json <<'EOF'
          {
            "name": "voy-pro-website-v2",
            "version": "1.33.0",
            "private": true,
            "scripts": {
              "build": "rm -rf dist && mkdir -p dist && cp -R site/. dist/ && node --check dist/assets/site.js"
            }
          }
          EOF

          cat > CONSOLIDATION.md <<'EOF'
          # VOY PRO website consolidation

          v1.33.0 is a source consolidation of the verified v1.32.9 staging output.

          ## What changed
          - The generated v1.32.9 website is now committed directly under `site/`.
          - Normal builds copy `site/` to `dist/` and syntax-check the browser JavaScript.
          - The old base64/tar + sequential override pipeline is retained under `legacy/v1.32.9-build-chain/` for audit/history only.
          - No customer-facing behavior is intentionally changed by this consolidation.

          ## Development rule
          New website work must edit the canonical files under `site/` (or introduce a proper source module structure later). Do not add another sequential patch chain.

          ## FBM boundary
          FBM/EZRaider OS remains the source of truth for catalog, pricing, availability, bookings, payment capabilities and booking/payment state. The website is the customer-facing client of those public contracts.
          EOF

          cat > README.md <<'EOF'
          # VOY PRO Website

          Canonical staging source for the VOY PRO customer-facing website.

          Current staged baseline: **v1.33.0** (consolidated from verified v1.32.9).

          The deployable website lives in `site/`. The build copies that canonical source to `dist/` and verifies browser JavaScript syntax.

          Key Budapest booking capabilities preserved in this baseline:
          - live catalog and availability from EZRaider OS / FBM public APIs;
          - Buda and Margaret tour selection with resilient fallback UI;
          - booking confirmation WhatsApp message with booking reference, tour, date/time, party, guide language, payment method, total and referral attribution;
          - payment capabilities loaded from the backend;
          - secure Pay now by card flow appears only when online-card payment is really enabled;
          - automatic email/WhatsApp confirmations remain backend responsibilities and activate only with configured providers.

          Historical patch/build machinery is archived under `legacy/v1.32.9-build-chain/` and must not be used for new feature development.
          EOF

          sed -i "s/r.version!=='1.32.9'/r.version!=='1.33.0'/" .github/workflows/verify-staging.yml
          sed -i "s/VOY PRO v1.32.9 booking confirmation + pay-now UI OK/VOY PRO v1.33.0 consolidated booking baseline OK/" .github/workflows/verify-staging.yml
          sed -i "s/r.version !== '1.28.0'/r.version !== '1.33.0'/" .github/workflows/deploy-prebuilt-staging.yml

      - name: Verify clean build is byte-equivalent except release metadata
        shell: bash
        run: |
          set -euo pipefail
          cp site/release.json /tmp/release-clean.json
          npm run build
          node --check dist/assets/site.js
          diff -rq site dist
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('dist/release.json','utf8'));
          if(r.version!=='1.33.0'||r.based_on!=='1.32.9'||r.build_model!=='consolidated-source'){
            throw new Error('Consolidated release metadata invalid');
          }
          const js=fs.readFileSync('dist/assets/site.js','utf8');
          for(const marker of ['/payments/capabilities','/payments/intents','pay_now_card','booking_confirmation','REQUEST_TIMEOUT']){
            if(!js.includes(marker)) throw new Error('Consolidated source lost marker: '+marker);
          }
          console.log('Clean v1.33.0 build verified');
          NODE

      - name: Commit consolidated baseline
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist site.tgz site.tgz.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Consolidate v1.32.9 into clean v1.33.0 baseline [skip ci]"
          git push origin HEAD:consolidate-v1.32.9

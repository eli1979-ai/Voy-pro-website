name: Budapest weekly review evidence
on:
  schedule:
    # Mondays, 08:17 UTC. No scraping; counts require human source evidence.
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: budapest-weekly-review-evidence
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'eli1979-ai/Voy-pro-website'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify stored Budapest counts and checklist format
        run: |
          node scripts/budapest-review-counts.mjs --check
          node scripts/weekly-review-audit.mjs --test
      - name: Generate read-only verification checklist
        shell: bash
        run: |
          node scripts/weekly-review-audit.mjs > "$RUNNER_TEMP/budapest-review-audit.md"
          cat "$RUNNER_TEMP/budapest-review-audit.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep one outstanding evidence-review issue
        uses: actions/github-script@v7
        env:
          REPORT_PATH: ${{ runner.temp }}/budapest-review-audit.md
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs=require('fs');
            const body=fs.readFileSync(process.env.REPORT_PATH,'utf8');
            const {owner,repo}=context.repo;
            const marker='<!-- voy-pro-budapest-weekly-reputation -->';
            const title='Budapest weekly review-count verification';
            const open=await github.paginate(github.rest.issues.listForRepo,{
              owner,repo,state:'open',per_page:100
            });
            const issue=open.find(item=>!item.pull_request && item.body?.includes(marker));
            if(issue){
              await github.rest.issues.update({owner,repo,issue_number:issue.number,body});
              core.info('Updated existing pending evidence task #'+issue.number);
            }else{
              const created=await github.rest.issues.create({owner,repo,title,body});
              core.info('Created evidence task #'+created.data.number);
            }

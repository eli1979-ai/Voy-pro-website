name: VOY PRO public cutover evidence
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/report-public-cutover.mjs'
      - 'scripts/test-public-cutover-report.mjs'
      - '.github/workflows/public-cutover-evidence.yml'
      - 'launch/production-environment.json'
      - 'site/release.json'
      - 'site/assets/runtime-config.js'
      - 'site/robots.txt'
      - 'vercel.json'

permissions:
  contents: read

concurrency:
  group: public-cutover-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify report is fail-closed
        run: node scripts/test-public-cutover-report.mjs
      - name: Generate source-only status (informational, never approval)
        shell: bash
        run: |
          mkdir -p cutover-evidence
          node scripts/report-public-cutover.mjs > cutover-evidence/report.md
          node scripts/report-public-cutover.mjs --json > cutover-evidence/status.json
          cat cutover-evidence/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve non-secret source evidence
        uses: actions/upload-artifact@v4
        with:
          name: voy-pro-public-cutover-source-evidence
          path: cutover-evidence/
          retention-days: 14
          if-no-files-found: error

name: Validate VOY PRO prebuilt Staging (manual)

# Safe trial only. No Git push triggers, no production target or alias.
on:
  workflow_dispatch:
    inputs:
      publish_preview:
        description: 'After review, publish one isolated Vercel Preview; default only validates locally'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: voy-website-prebuilt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pilot:
    # Deployment credentials are never exposed to feature branches or fork PRs.
    if: github.repository == 'eli1979-ai/Voy-pro-website' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VERCEL_ORG_ID: team_AA8zTEaOrKIoyiAbn42L4CoU
      VERCEL_PROJECT_ID: prj_mllzA4eTnK6ITda3AI7BpHbmVe7j
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check manual prebuilt safety contract
        run: node scripts/check-prebuilt-workflow.mjs

      - name: Build and test canonical source on GitHub Actions
        run: |
          set -euo pipefail
          npm run build
          npm run verify:launch
          npm run qa:site

      - name: Install reviewed Vercel CLI
        run: npm install --global vercel@63.1.2

      - name: Pull only Preview build settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          vercel pull --yes --environment=preview

      - name: Build authentic Vercel output on GitHub runner (no Vercel Build CPU)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          vercel build
          test -f .vercel/output/config.json
          test -f .vercel/output/static/release.json
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const src = JSON.parse(fs.readFileSync('site/release.json', 'utf8'));
          const out = JSON.parse(fs.readFileSync('.vercel/output/static/release.json', 'utf8'));
          const config = JSON.parse(fs.readFileSync('.vercel/output/config.json', 'utf8'));
          if (config.version !== 3) throw Error('Unexpected Build Output API version');
          if (pkg.version !== src.version || src.version !== out.version) throw Error('Stale or mismatched release');
          if (out.target !== 'staging' || out.seo_indexable !== false) throw Error('Unsafe release flags');
          if (!fs.existsSync('.vercel/output/static/index.html')) throw Error('Root homepage missing');
          for (const path of ['budapest/index.html', 'he/budapest/index.html', 'hu/budapest/index.html', 'portugal/index.html', 'pt/portugal/index.html', 'he/portugal/index.html']) {
            if (!fs.existsSync('.vercel/output/static/' + path)) throw Error('Missing localized page: ' + path);
          }
          console.log('Official prebuilt artifact source/version/languages: OK');
          NODE

      - name: Fail closed on canonical redirects, headers, assets and robots parity
        run: node scripts/check-prebuilt-output.mjs

      # Never publish unless the owner explicitly selects publish_preview.
      # This creates an isolated preview URL, not a Production deployment/alias.
      - name: Publish isolated Preview (explicit manual opt-in)
        if: inputs.publish_preview
        id: preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          URL="$(vercel deploy --prebuilt)"
          case "$URL" in
            https://*.vercel.app) ;;
            *) echo "Unexpected preview URL; refusing to proceed"; exit 1;;
          esac
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Prebuilt Preview: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test protected Preview before considering any release
        if: inputs.publish_preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          set -euo pipefail
          vercel curl /release.json --deployment "$PREVIEW_URL" > /tmp/voy-release.json
          for path in / /budapest/ /he/budapest/ /hu/budapest/ /portugal/ /he/portugal/ /pt/portugal/; do
            vercel curl "$path" --deployment "$PREVIEW_URL" > /tmp/voy-page.html
            grep -Eqi '<html|<!doctype' /tmp/voy-page.html
          done
          node - <<'NODE'
          const fs = require('node:fs');
          const got = JSON.parse(fs.readFileSync('/tmp/voy-release.json', 'utf8'));
          const want = JSON.parse(fs.readFileSync('site/release.json', 'utf8'));
          if (got.version !== want.version || got.target !== 'staging' || got.seo_indexable !== false) {
            throw Error('Published Preview release differs from reviewed Staging source');
          }
          NODE
          # Further parity gate (HTTP security headers / redirects / auth / FBM)
          # is mandatory before approval of a production workflow replacement.

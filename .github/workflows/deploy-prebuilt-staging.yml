name: Deploy prebuilt staging to Vercel

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: team_AA8zTEaOrKIoyiAbn42L4CoU
      VERCEL_PROJECT_ID: prj_mllzA4eTnK6ITda3AI7BpHbmVe7j
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Vercel token is configured
        shell: bash
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "Missing repository secret VERCEL_TOKEN"
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull staging project settings
        run: vercel pull --yes --environment=preview --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build locally
        run: vercel build --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy prebuilt artifact
        id: deploy
        shell: bash
        run: |
          URL="$(vercel deploy --prebuilt --token="${{ secrets.VERCEL_TOKEN }}")"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### VOY PRO staging preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test deployed release
        shell: bash
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          curl --fail --silent --show-error "$URL/release.json" | tee /tmp/release.json
          node - <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('/tmp/release.json','utf8'));
          if (r.version !== '1.28.0') throw new Error('Unexpected version '+r.version);
          if (r.target !== 'staging') throw new Error('Expected staging target');
          if (r.seo_indexable !== false) throw new Error('Staging must be noindex');
          console.log('Smoke test OK', r);
          NODE

name: Deploy prebuilt staging to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: team_AA8zTEaOrKIoyiAbn42L4CoU
      VERCEL_PROJECT_ID: prj_mllzA4eTnK6ITda3AI7BpHbmVe7j
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Vercel token is configured
        shell: bash
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "Missing repository secret VERCEL_TOKEN"
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Build reviewed staging artifact
        run: npm run build

      - name: Create Vercel Build Output API artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .vercel
          mkdir -p .vercel/output/static
          cp -a dist/. .vercel/output/static/
          cat > .vercel/project.json <<EOF
          {"orgId":"$VERCEL_ORG_ID","projectId":"$VERCEL_PROJECT_ID"}
          EOF
          cat > .vercel/output/config.json <<'EOF'
          {
            "version": 3,
            "routes": [
              {"src": "^/$", "status": 307, "headers": {"Location": "/budapest/"}},
              {"src": "/manage/(.*)", "headers": {"X-Robots-Tag": "noindex, nofollow", "Cache-Control": "private, no-store, max-age=0"}},
              {"src": "/(.*)", "headers": {"X-Content-Type-Options": "nosniff", "Referrer-Policy": "strict-origin-when-cross-origin", "X-Frame-Options": "DENY", "Permissions-Policy": "camera=(), microphone=(), geolocation=(), usb=()", "Cross-Origin-Opener-Policy": "same-origin"}, "continue": true},
              {"handle": "filesystem"}
            ]
          }
          EOF

      - name: Deploy prebuilt artifact
        id: deploy
        shell: bash
        run: |
          URL="$(vercel deploy --prebuilt --token="${{ secrets.VERCEL_TOKEN }}")"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### VOY PRO staging preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test deployed release
        shell: bash
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          curl --fail --silent --show-error "$URL/release.json" | tee /tmp/release.json
          curl --fail --silent --show-error "$URL/budapest/" >/tmp/budapest.html
          curl --fail --silent --show-error "$URL/he/portugal/" >/tmp/portugal-he.html
          curl --fail --silent --show-error "$URL/pt/portugal/" >/tmp/portugal-pt.html
          node - <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('/tmp/release.json','utf8'));
          if (r.version !== '1.28.0') throw new Error('Unexpected version '+r.version);
          if (r.target !== 'staging') throw new Error('Expected staging target');
          if (r.seo_indexable !== false) throw new Error('Staging must be noindex');
          console.log('Smoke test OK', r);
          NODE

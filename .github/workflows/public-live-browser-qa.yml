name: VOY PRO public live Chrome QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/qa-public-live-browser.mjs'
      - 'scripts/qa-public-live-interactions.mjs'
      - 'site/assets/budapest-review-ticker.js'
      - 'site/assets/budapest-review-ticker.css'
      - 'site/assets/budapest-approved-reviews.json'
      - '.github/workflows/public-live-browser-qa.yml'
      - 'site/sitemap.xml'
  workflow_dispatch:
  schedule:
    # Weekly, not a new paid service. Continues staging safety monitoring.
    - cron: '23 7 * * 1'

permissions:
  contents: read

concurrency:
  group: voy-pro-public-live-chrome-${{ github.ref }}
  # Scope to each branch/PR: never cancel work from another development chat.
  # Cancel outdated runs from superseded commits on the same PR only.
  cancel-in-progress: true

jobs:
  live-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate the QA script
        run: node --check scripts/qa-public-live-browser.mjs
      - name: Install pinned Chrome driver
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          google-chrome --version
      - name: Validate live interaction QA script
        run: node --check scripts/qa-public-live-interactions.mjs
      - name: Exercise deployed mobile menu, approved review ticker, maps and read-only booking UI
        run: node scripts/qa-public-live-interactions.mjs
      # Fail fast on UI regressions; screenshot sweep follows interaction checks.
      - name: Inspect public staging aliases using anonymous GET only
        run: node scripts/qa-public-live-browser.mjs
      - name: Upload browser evidence even after failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: voy-pro-public-live-browser
          path: |
            visual-qa-output/public-live/
            visual-qa-output/public-live-interactions/
          if-no-files-found: warn
          retention-days: 7

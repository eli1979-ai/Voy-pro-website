 function sectionForTours(){

 function exactTitleNodes(scope, key){
   var tags='h2,h3,h4,h5,h6,strong,b,span,p,div,a';

     if(n.closest('#ezre-wa-float-v1'))return false;
     if(n.closest('[data-ezre-detail-title-v3="1"]'))return false;
     if(n.closest('nav,footer,header'))return false;
     return normalizeName(n.textContent)===key;
   });

   return candidates.filter(function(n){
     for(var j=0;j<candidates.length;j++)if(candidates[j]!==n&&n.contains(candidates[j]))return false;
     return true;

 function cardContainer(titleEl,scope){

   if(element.dataset.ezreDetailTitleV3)return;

   if(element.tagName.toLowerCase()==='a'){
     element.href=dest;element.removeAttribute('target');
     element.classList.add('ezre-tour-title-link-v3');
   }else if(!element.querySelector('a,button,input,select')){
     var a=document.createElement('a');a.href=dest;a.className='ezre-tour-title-link-v3';
     while(element.firstChild)a.appendChild(element.firstChild);

     element.setAttribute('tabindex','0');element.setAttribute('role','link');
     element.addEventListener('click',function(ev){
       if(ev.target&&ev.target.closest&&ev.target.closest('a,button'))return;

 /* Fix only the legacy duplicate floating red booking/enquiry element that overlaps the
    green WhatsApp button. Never remove ordinary in-page or tour-card enquiry buttons. */
 function hideOverlappingLegacyFloat(){
   var green=document.getElementById('ezre-wa-float-v1');
   if(!green||!green.getBoundingClientRect)return;
   var gr=green.getBoundingClientRect();
   if(!gr.width||!gr.height)return;
   var all=document.querySelectorAll('a[href],button');
   for(var i=0;i<all.length;i++){
     var el=all[i];
     if(el===green||green.contains(el)||el.dataset.ezreLegacyFloatHidden==='1')continue;
     var label=(el.textContent||el.getAttribute('aria-label')||'').replace(/\s+/g,' ').trim().toLowerCase();
     if(!/enqu(?:i|e)re.*whats\s*app|book.*whats\s*app|פנייה ב.?whats\s*app|érdeklődés whats\s*appon/i.test(label))continue;
     var url=(el.getAttribute('href')||'').toLowerCase();
     if(url&&!/wa\.me\/36300993099|fareharbor\.com/.test(url))continue;
     var floating=false,node=el;
     for(var depth=0;node&&depth<8;depth++,node=node.parentElement){
       var pos=getComputedStyle(node).position;
       if(pos==='fixed'||pos==='sticky'){floating=true;break;}
     }
     if(!floating)continue;
     var r=el.getBoundingClientRect();
     var area=Math.max(0,Math.min(gr.right,r.right)-Math.max(gr.left,r.left))*
              Math.max(0,Math.min(gr.bottom,r.bottom)-Math.max(gr.top,r.top));
     if(r.width>0&&r.height>0&&area>Math.min(gr.width*gr.height,r.width*r.height)*0.12){
       /* Hide only this competing element, preserving the green WhatsApp and all normal CTAs. */
       el.dataset.ezreLegacyFloatHidden='1';
       el.style.setProperty('display','none','important');
     }
   }
 }
 /* Current Budapest contact address is published by bespoke ACF/PHP; update only the
    known obsolete public email and its mailto anchors. Never edit WP admin_email. */
 function correctBudapestEmail(){
   var oldEmail=/voy\.pro\.eu@gmail\.com/gi;
   var replacement='Voyprobud@gmail.com';
   var mailLinks=document.querySelectorAll('a[href^="mailto:"]');
   for(var j=0;j<mailLinks.length;j++){
     var href=mailLinks[j].getAttribute('href')||'';
     if(oldEmail.test(href))mailLinks[j].setAttribute('href',href.replace(oldEmail,replacement));
     oldEmail.lastIndex=0;
   }
   var walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,null);var node;
   while((node=walker.nextNode())){
     if(!node.parentElement||node.parentElement.closest('script,style,noscript,textarea,pre,code'))continue;
     if(oldEmail.test(node.nodeValue||''))node.nodeValue=node.nodeValue.replace(oldEmail,replacement);
     oldEmail.lastIndex=0;
   }
 }
